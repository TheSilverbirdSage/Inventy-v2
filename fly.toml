# fly.toml app configuration file generated for inventy-v2 on 2026-10-30T15:01:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inventy-v2'
primary_region = 'ams'

[build]

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
